
name: Build Volume Power APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_FILE="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found inside ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VolumePower-debug-apk
          path: extracted/VolumePowerApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
