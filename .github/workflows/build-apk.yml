
name: Build Volume Power APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project ZIP
        run: |
          set -eu
          mkdir -p extracted
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d extracted

          PROJECT_FILE="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No Gradle settings file found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Align Java and Kotlin versions
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "compileOptions" not in s:
              marker = "    kotlinOptions {"
              block = (
                  "    compileOptions {\n"
                  "        sourceCompatibility = JavaVersion.VERSION_17\n"
                  "        targetCompatibility = JavaVersion.VERSION_17\n"
                  "    }\n\n"
              )
              if marker in s:
                  s = s.replace(marker, block + marker, 1)
              else:
                  android_marker = "android {"
                  if android_marker not in s:
                      raise SystemExit("Could not find android block in app/build.gradle.kts")
                  s = s.replace(
                      android_marker,
                      android_marker + "\n"
                      "    compileOptions {\n"
                      "        sourceCompatibility = JavaVersion.VERSION_17\n"
                      "        targetCompatibility = JavaVersion.VERSION_17\n"
                      "    }\n",
                      1
                  )

          if "kotlinOptions {" in s:
              start = s.index("kotlinOptions {")
              end = s.index("}", start)
              block = s[start:end + 1]
              import re
              if re.search(r'jvmTarget\s*=', block):
                  block = re.sub(r'jvmTarget\s*=\s*"[^"]+"',
                                 'jvmTarget = "17"', block)
              else:
                  block = block[:-1] + '\n        jvmTarget = "17"\n    }'
              s = s[:start] + block + s[end + 1:]

          p.write_text(s)
          print("Updated Java/Kotlin targets in", p)
          PY

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VolumePower-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
